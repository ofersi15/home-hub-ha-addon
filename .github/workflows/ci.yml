name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: home_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: home_hub/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: No secrets in the repo
        working-directory: .
        run: |
          # Public repo: fail on anything that looks like a credential.
          if git grep -nIE '(AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[0-9A-Za-z]{36}|sk-ant-[0-9A-Za-z_-]{20,}|re_[0-9A-Za-z]{20,})' -- . ':!*.lock' ':!**/package-lock.json'; then
            echo "Possible secret committed"; exit 1
          fi

  lint-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./home_hub"

  docker:
    # Slow on purpose: emulated aarch64 build of the real image (npm ci + tsc under QEMU).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Base image from build.yaml
        id: base
        run: echo "from=$(grep -E '^\s+${{ matrix.arch }}:' home_hub/build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: home_hub
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=ci
